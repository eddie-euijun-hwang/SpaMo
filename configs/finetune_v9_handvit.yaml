model:
  target: spamo.t5_slt.FlanT5SLT

  params:
    lr: 6.0e-4
    fusion_lr: 6.0e-5
    monitor: val/alignment_gap
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into English."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_dropout: 0.3
    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: true
    combined_loss: false
    alpha: 1.0
    use_in_context: false
    num_in_context: 0
    queue_size: 4096
    motion_input_size: 2048   # hand_vit_feat dim

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 1
    accelerator: gpu
    devices: 1
    max_epochs: 60
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.pjm.PJMDataModule
  params:
    batch_size: 8
    num_workers: 4
    visual_features_path: features/vit_feat_pjm.h5
    motion_features_path: features/hand_vit_feat_pjm.h5   # hand-crop ViT instead of VideoMAE
    texts_path: features/texts_eng.h5
    train_split_path: data/splits/split_train_filtered.csv
    val_split_path: data/splits/split_val_filtered.csv
    test_split_path: data/splits/split_test_filtered.csv
    device: cuda
    max_frame_length: 512
    set_to_test: test
