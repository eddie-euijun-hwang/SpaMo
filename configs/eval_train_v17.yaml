model:
  target: spamo.t5_slt.FlanT5SLT

  params:
    lr: 1.0e-4
    fusion_lr: 1.0e-5
    monitor: val/loss
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 4
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into English."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_dropout: 0.3
    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: true
    combined_loss: true
    alpha: 0.1
    use_in_context: false
    num_in_context: 0
    queue_size: 4096
    keypoint_dim: 258
    aux_input_size: 2048
    motion_input_size: 1024
    lr_patience: 5
    lr_scheduler_mode: min

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: epoch
  trainer:
    accumulate_grad_batches: 1
    accelerator: gpu
    devices: 1
    max_epochs: 1
    precision: bf16

data:
  target: dataset.pjm.PJMDataModule
  params:
    batch_size: 8
    num_workers: 4
    visual_features_path: features/vit_feat_pjm.h5
    motion_features_path: features/mae_feat_pjm.h5
    aux_features_path: features/hand_vit_feat_pjm.h5
    keypoint_features_path: features/mediapipe_feat_pjm.h5
    texts_path: features/texts_eng.h5
    train_split_path: data/splits/split_train_filtered.csv
    val_split_path: data/splits/split_val_filtered.csv
    test_split_path: data/splits/split_train_filtered.csv
    device: cuda
    max_frame_length: 512
    set_to_test: test
