# v23b — paper-faithful PJM-MS finetune, English target, init z best(v22c, v22d).
# Wszystkie hyperparams jak v22c/v22d (alpha=1.0, in_context=3, cosine+warmup, lr=6e-4 → 1e-4 dla finetune).
# Tylko target language i splity różnią — i lr (niższy bo finetune z dobrego initu).
model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 1.0e-4               # niższy LR dla finetune (paper miał 6e-4 dla pretrainu)
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: true
    num_in_context: 3
    keypoint_dim: 258         # quad — będzie pasować do v22d ckpt; v22c dual też się załaduje (compatible filter)
    aux_input_size: 2048
    motion_input_size: 1024
    scheduler_config:
      target: spamo.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 4000
        lr_min: 0.0
        lr_max: 1.0
        lr_start: 0.0
        max_decay_steps: 80000

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 8
    accelerator: gpu
    devices: 1
    max_epochs: 100
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.pjm.PJMDataModule
  params:
    batch_size: 2
    num_workers: 4
    visual_features_path: features/vit_feat_pjm.h5
    motion_features_path: features/mae_feat_pjm.h5
    aux_features_path: features/hand_vit_feat_pjm.h5
    keypoint_features_path: features/mediapipe_feat_pjm.h5
    texts_path: features/texts_eng.h5      # angielski target (jak v20b/v21)
    multilang_path: features/texts_multilang_pjm.h5
    target_lang: English
    train_split_path: data/splits/split_train_ms.csv
    val_split_path: data/splits/split_val_ms.csv
    test_split_path: data/splits/split_test_ms.csv
    device: cuda
    max_frame_length: 512
    set_to_test: test
