# v22c — paper-faithful SpaMo na PHOENIX-2014T (DUAL streams).
# Cel: zlikwidować gap z paperem (BLEU 24.32) przez match: scheduler cosine+warmup,
# alpha=1.0, use_in_context=true/3, lr=6e-4, batch=8, max_epochs=300.
# Streams: dual (ViT + MAE), DE→DE jak w paperze.
model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 6.0e-4
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: true
    num_in_context: 3
    queue_size: 2048              # paper miał 4096 ale to za dużo na 24GB; połowa to wciąż dużo negatywów
    keypoint_dim: 0           # dual
    aux_input_size: 0         # dual
    motion_input_size: 1024
    scheduler_config:
      target: spamo.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 4000
        lr_min: 0.0
        lr_max: 1.0
        lr_start: 0.0
        max_decay_steps: 80000

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 8   # eff=16 zachowane (batch=2 * acc=8); paper miał batch=8*acc=2 ale na A100
    accelerator: gpu
    devices: 1
    max_epochs: 300
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.p14t_datamodule.Phoenix14TDataModule
  params:
    batch_size: 2              # OOM przy batch=4 — paper-faithful in_context+contrastive za duże na 24GB
    num_workers: 4
    anno_root: preprocess/Phoenix14T
    spatial_root: features/p14t/spatial
    motion_root: features/p14t/motion
    text_field: text          # native niemiecki, jak paper
    device: cuda
    max_frame_length: 512
    set_to_test: test
