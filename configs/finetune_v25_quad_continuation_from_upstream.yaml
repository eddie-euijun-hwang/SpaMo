# v25 — quad continuation z upstream PJM-MS dual ckpt (BLEU 5.36 dev).
# Init: SpaMo PHOENIX-2014T MS checkpoint, CrocoSign/pjm-models checkpoints/spamo/spamo-pjm-phoenix-ms/epoch=00043-step=0129844-bleu4=5.36.ckpt
# Cel: dorzucić hand_ViT + MediaPipe streams (które nie były w upstream dual), zobaczyć czy +X BLEU.
# Soft-freeze trained modules przez fusion_lr=lr/10. Random aux_proj/kp_proj zaczynają od zera.
model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 1.0e-4              # T5 + LoRA — moderate finetune LR
    fusion_lr: 1.0e-5       # already-trained projectors (spatio/spatiotemp/fusion/temporal_encoder) — soft-freeze
    new_stream_lr: 1.0e-4   # NEW: aux_proj (hand_ViT) + kp_proj (MediaPipe) random init — fast learning
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_dropout: 0.3
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: true
    num_in_context: 3
    queue_size: 0           # paper-faithful: bez memory bank (zamiast queue → clip_loss bilateral)
    keypoint_dim: 258       # NEW: MediaPipe stream
    aux_input_size: 2048    # NEW: hand_ViT stream
    motion_input_size: 1024
    lr_patience: 5
    lr_scheduler_mode: max
    scheduler_config:
      target: spamo.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 1000   # krótki warmup bo z dobrego initu
        lr_min: 0.1            # LR nigdy < 10% peak (utrzymujemy gradient w continuation)
        lr_max: 1.0
        lr_start: 0.0
        max_decay_steps: 30000

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 4    # eff batch = 8 (jak upstream batch=2 acc=4)
    accelerator: gpu
    devices: 1
    max_epochs: 15                 # krótka continuation
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1     # waliduj co epokę (krótki run)
    precision: bf16

data:
  target: dataset.pjm.PJMDataModule
  params:
    batch_size: 2                  # 24GB GPU constraint (paper-faithful + quad ciężkie)
    num_workers: 4
    visual_features_path: features/vit_feat_pjm.h5
    motion_features_path: features/mae_feat_pjm.h5
    aux_features_path: features/hand_vit_feat_pjm.h5
    keypoint_features_path: features/mediapipe_feat_pjm.h5
    texts_path: features/texts_eng.h5            # EN target (jak upstream)
    multilang_path: features/texts_multilang_pjm.h5
    target_lang: English
    train_split_path: data/splits/split_train_ms.csv
    val_split_path: data/splits/split_val_ms.csv
    test_split_path: data/splits/split_test_ms.csv
    device: cuda
    max_frame_length: 512
    set_to_test: test
