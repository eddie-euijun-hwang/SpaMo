model:
  target: spamo.t5_slt.FlanT5SLT

  params:
    lr: 3.0e-4
    fusion_lr: 3.0e-5
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048          # ViT spatial
    beam_size: 4
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into English."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_dropout: 0.3
    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: true
    combined_loss: true
    alpha: 0.1                # głównie generacja, mały contrastive (jak v20)
    use_in_context: false
    num_in_context: 0
    queue_size: 4096
    keypoint_dim: 258         # MediaPipe
    aux_input_size: 2048      # hand_ViT
    motion_input_size: 1024   # MAE
    lr_patience: 5
    lr_scheduler_mode: max    # monitor=val/bleu4 — maksymalizacja

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: epoch
  trainer:
    accumulate_grad_batches: 2
    accelerator: gpu
    devices: 1
    max_epochs: 100
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: bf16

data:
  target: dataset.p14t_datamodule.Phoenix14TDataModule
  params:
    batch_size: 4
    num_workers: 4
    anno_root: preprocess/Phoenix14T
    spatial_root: features/p14t/spatial
    motion_root: features/p14t/motion
    aux_features_path: features/hand_vit_feat_p14t.h5
    keypoint_features_path: features/mediapipe_feat_p14t.h5
    text_field: en_text
    device: cuda
    max_frame_length: 512
    set_to_test: test
