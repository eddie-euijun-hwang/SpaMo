# v22d — paper-faithful settings + nasz QUAD (ViT+MAE+hand_ViT+MediaPipe).
# Cel: sprawdzić czy quad ponad paper-faithful dual daje boost, czy szkodzi.
# Wszystko jak v22c poza włączonymi 4 streamami.
model:
  target: spamo.t5_slt.FlanT5SLT
  params:
    lr: 6.0e-4
    monitor: val/bleu4
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: true
    num_in_context: 3
    queue_size: 2048
    keypoint_dim: 258         # MediaPipe
    aux_input_size: 2048      # hand_ViT
    motion_input_size: 1024
    scheduler_config:
      target: spamo.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 4000
        lr_min: 0.0
        lr_max: 1.0
        lr_start: 0.0
        max_decay_steps: 80000

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 8
    accelerator: gpu
    devices: 1
    max_epochs: 300
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.p14t_datamodule.Phoenix14TDataModule
  params:
    batch_size: 2
    num_workers: 4
    anno_root: preprocess/Phoenix14T
    spatial_root: features/p14t/spatial
    motion_root: features/p14t/motion
    aux_features_path: features/hand_vit_feat_p14t.h5
    keypoint_features_path: features/mediapipe_feat_p14t.h5
    text_field: text
    device: cuda
    max_frame_length: 512
    set_to_test: test
