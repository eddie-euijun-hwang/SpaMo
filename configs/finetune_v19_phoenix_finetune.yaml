model:
  target: spamo.t5_slt.FlanT5SLT

  params:
    lr: 1.0e-4
    fusion_lr: 1.0e-5
    monitor: val/loss
    model_name: google/flan-t5-xl
    cache_dir: null
    inter_hidden: 768
    input_size: 2048          # vit_feat (spatial stream)
    beam_size: 4
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into English."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_dropout: 0.3
    fusion_mode: joint
    warm_up_steps: null
    cross_modal_align: false
    combined_loss: true
    alpha: 0.0                # czysta CE generacja — jak v18 ale z phoenix init
    keypoint_dim: 0           # brak MediaPipe — kompatybilne z phoenix checkpoint
    aux_input_size: 0         # brak hand ViT — kompatybilne z phoenix checkpoint
    motion_input_size: 1024   # mae_feat dim — jak w pretrained
    lr_patience: 5
    lr_scheduler_mode: min

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: epoch
  trainer:
    accumulate_grad_batches: 1
    accelerator: gpu
    devices: 1
    max_epochs: 60
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 1
    precision: bf16

data:
  target: dataset.pjm.PJMDataModule
  params:
    batch_size: 8
    num_workers: 4
    visual_features_path: features/vit_feat_pjm.h5
    motion_features_path: features/mae_feat_pjm.h5
    texts_path: features/texts_eng.h5
    train_split_path: data/splits/split_train_filtered.csv
    val_split_path: data/splits/split_val_filtered.csv
    test_split_path: data/splits/split_test_filtered.csv
    device: cuda
    max_frame_length: 512
    set_to_test: test
